database: medvision.sqlite
# video_sides / video_pairs YA NO VAN AQUI. Antes vivian en este fichero, y
# cada zip nuevo del proyecto los pisaba silenciosamente (paso dos veces
# en la validacion real, ver docs/cuaderno_ingenieria_1.7.md y el aviso de
# consola que se añadio en infer_side()). Ahora se generan aparte:
#
#   medvision-ai plan-sessions --videos-dir videos --output config/sessions.yaml
#   medvision-ai build-dataset --videos-dir videos --output-dir output \
#       --config config/default.yaml --sessions config/sessions.yaml
#
# config/sessions.yaml es vuestro, no lo genero ni lo toco yo entre
# entregas — asi no se puede volver a perder.
sampling:
  # Antes (2.0s): solo ~6 frames muestreados en un video de ~11s, y de esos
  # el lado pastilla (MVI_2713) solo detecto tira en 1 de 6 -> con una unica
  # observacion de pastilla, el emparejamiento contra varias bolsitas reales
  # del lado etiqueta esta condenado a acertar como mucho 1 de N (ver
  # docs/cuaderno_ingenieria_2.0.md). Se prueba mas denso para dar mas
  # oportunidades de deteccion a ambos lados, sin tocar codigo todavia.
  seconds_between_frames: 0.4
  max_frames_per_video: 30
  # 0 para los videos horizontales de siempre (MVI_2603-2729). Para
  # grabacion VERTICAL (probado con 4 videos reales, agosto 2026): la camara
  # no escribe metadato de rotacion, los pixeles llegan en horizontal
  # (1920x1080) con el contenido girado -- confirmado visualmente, texto
  # ilegible sin rotar. 90 = sentido horario, corrige la orientacion real
  # comprobada. Si usais una camara/movil distinto, comprobad antes con una
  # imagen: si el texto no se lee al girar 90, probad -90 o 180.
  rotate_degrees: 0
bag_detection:
  # 205 fallaba al 100% contra la camara nueva (MVI_2713/2714, mas oscura que
  # el iPhone de la demo 1.0-1.3). Con estos 2 videos, 80-100 detecta bien.
  # PENDIENTE: validar/recalibrar contra una muestra mas amplia de los 108
  # videos reales antes de confiar en este valor como definitivo.
  threshold_value: 100
  min_area_ratio: 0.08
bag_splitting:
  min_segment_height: 180
  # Con la camara nueva (mas cerca que el iPhone de la demo), cada frame suele
  # mostrar como mucho UNA bolsita SPD, no varias -> no hay costura real que
  # buscar dentro del frame. Con max_segments>1, el fallback de reparto
  # equitativo cortaba una bolsita entera en franjas arbitrarias (visto con
  # datos reales, ver docs/cuaderno_ingenieria_1.7.md). max_segments=1
  # desactiva el corte: cada franja detectada se trata como una sola bolsa.
  max_segments: 1
  margin: 8
ocr:
  enabled: true
  # Codigo de idioma de PaddleOCR (PP-OCRv6 usa un modelo latino unificado que ya
  # cubre es/en conjuntamente; no existe equivalente al "spa+eng" de Tesseract).
  lang: es
  engine: paddle  # paddle | transformers (backend de inferencia de PaddleOCR 3.x)
  min_word_score: 0.5  # descarta palabras individuales con score de reconocimiento bajo
  # El lado pastilla puede tener texto legible, reflejado por transparencia
  # desde el reverso (confirmado con foto real, ver
  # docs/cuaderno_ingenieria_2.9.md). Se voltea horizontalmente antes de OCR.
  # Desactivar si en algun lote el plastico es demasiado opaco para leerse.
  pill_side_enabled: true
  auto_accept_confidence: 80
selection:
  limit_per_video_side: 20
tracking:
  appearance_weight: 0.72
  position_weight: 0.20
  order_weight: 0.08
  min_match_score: 0.68
  max_position_delta: 0.48
  max_gap_seconds: 8.5
  descriptor_momentum: 0.70
pairing:
  auto_accept_ocr_confidence: 70
